[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varne-api"
version = "1.0.0-alpha.0"
description = "varne - selfhosted FinOps platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "jinja2==3.1.6",
    "dlt[sqlalchemy,postgres,filesystem,az]==1.30.0",
    "s3fs<2026.0.0",
    "sf-hamilton[visualization]>=1.88.0",
    "cryptography==50.0.0",
    "httpx==0.28.1",
    "google==3.0.0",
    "google-cloud-bigquery==3.44.0",
    "google-cloud-bigquery-storage==2.41.0",
    "boto3",
    "pyarrow>=10.0.0",
    "azure-storage-blob==12.30.1",
]

[tool.setuptools.packages.find]
include = ["app*", "focus*", "pipeline*", "providers*"]
exclude = ["tests*", "temp*", "logs*", "data*", "migrations*", "metadata*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings  
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501", "B008"  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore:The default datetime adapter is deprecated.*:DeprecationWarning:sqlalchemy.engine.default",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
